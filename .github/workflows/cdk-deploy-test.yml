# ~~ Generated by projen. To modify, edit .projenrc.py and run "uv run projen".

name: cdk-deploy-test
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy CDK stacks to test AWS account
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
      - name: Setup python environment
        id: setup_python_environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v10
      - name: Install dependencies
        id: install_dependencies
        run: uv sync
      - name: Install cdk cli
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1139.0
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubDeployRole
          aws-region: us-east-1
      - name: Validate CDK for the TEST environment
        id: validate_cdk_for_the_test_environment
        run: uv run projen test:validate
      - name: Deploy CDK to the TEST environment on AWS account 123456789012
        id: deploy_cdk_to_the_test_environment_on_aws_account_123456789012
        run: uv run projen test:deploy
