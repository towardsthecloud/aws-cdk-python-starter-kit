# ~~ Generated by projen. To modify, edit .projenrc.py and run "uv run projen".

name: cdk-destroy-test-branch
on:
  delete: {}
  workflow_dispatch: {}
jobs:
  destroy:
    name: Remove deployment of feature branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: test
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && github.event_name == 'delete' && github.event.ref != 'main' && !startsWith(github.event.ref, 'hotfix/') && !startsWith(github.event.ref, 'github-actions/') && !startsWith(github.event.ref, 'dependabot/'))
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v6
      - name: Setup python environment
        id: setup_python_environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::987654321012:role/GitHubActionsServiceRole
          aws-region: us-east-1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync --frozen
      - name: Fetch Deleted Branch Name
        id: destroy-branch
        if: github.event.ref_type == 'branch' && github.event_name == 'delete'
        run: BRANCH=$(cat ${{ github.event_path }} | jq --raw-output '.ref'); echo "${{ github.repository }} has ${BRANCH} branch"; echo "DESTROY_BRANCH_NAME=$BRANCH" >> $GITHUB_OUTPUT
      - name: Destroy Branch Stack (Workflow Dispatch)
        id: destroy_branch_stack_workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GIT_BRANCH_REF: ${{ github.ref_name }}
        run: uv run projen test:branch:destroy:all
      - name: Destroy Branch Stack (Branch Deletion)
        id: destroy_branch_stack_branch_deletion
        if: github.event.ref_type == 'branch' && github.event_name == 'delete'
        env:
          GIT_BRANCH_REF: ${{ steps.destroy-branch.outputs.DESTROY_BRANCH_NAME }}
        run: uv run projen test:branch:destroy:all
