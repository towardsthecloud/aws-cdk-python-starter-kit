# ~~ Generated by projen. To modify, edit .projenrc.py and run "uv run projen".

name: cdk-validate
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  validate:
    name: Validate CDK app offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup python environment
        id: setup_python_environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync --frozen
      - name: Install cdk cli
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1139.0
      - name: Choose Docker cache refresh week
        id: docker_cache_epoch
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Docker asset images
        id: docker_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/docker-assets
          key: docker-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.docker_cache_epoch.outputs.week }}-${{ hashFiles('uv.lock', 'src/**', 'tests/**') }}
          restore-keys: docker-assets-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.docker_cache_epoch.outputs.week }}-
      - name: Load Docker asset images
        id: load_docker_asset_images
        run: if [ -f "$RUNNER_TEMP/docker-assets/images.tar" ]; then docker load --input "$RUNNER_TEMP/docker-assets/images.tar"; fi
      - name: Validate dev offline
        id: validate_dev
        run: uv run projen dev:validate --no-online --output cdk.out/dev
        background: true
      - name: Validate test offline
        id: validate_test
        run: uv run projen test:validate --no-online --output cdk.out/test
        background: true
      - name: Run tests
        id: unit_tests
        run: uv run projen test
        background: true
      - name: Wait for validation and tests
        id: wait_for_validation_and_tests
        wait:
          - validate_dev
          - validate_test
          - unit_tests
      - name: Export Docker asset images
        id: export_docker_images
        if: steps.docker_cache.outputs.cache-hit != 'true'
        run: |-
          images=()
          while IFS= read -r image; do images+=("$image"); done < <(docker image ls --filter "reference=cdk-*" --format "{{.Repository}}:{{.Tag}}")
          if [ "${#images[@]}" -gt 0 ]; then
            mkdir -p "$RUNNER_TEMP/docker-assets"
            docker save --output "$RUNNER_TEMP/docker-assets/images.tar" "${images[@]}"
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Save Docker asset images
        id: save_docker_asset_images
        if: steps.export_docker_images.outputs.has-images == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/docker-assets
          key: ${{ steps.docker_cache.outputs.cache-primary-key }}
