# ~~ Generated by projen. To modify, edit .projenrc.py and run "uv run projen".

name: cdk-validate
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  validate:
    name: Validate CDK app offline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup python environment
        id: setup_python_environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync
      - name: Install cdk cli
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1139.0
      - name: Validate CDK app against the default rule set
        id: validate_cdk_app_against_the_default_rule_set
        run: uv run projen validate
