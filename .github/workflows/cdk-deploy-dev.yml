name: cdk-deploy-dev
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    name: Deploy CDK stacks to dev AWS account
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup python environment
        id: setup_python_environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync
      - name: Install cdk cli
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1139.0
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::987654321012:role/GitHubDeployRole
          aws-region: us-east-1
      - name: Validate CDK for the DEV environment
        id: validate_cdk_for_the_dev_environment
        run: uv run projen dev:validate
      - name: Deploy CDK to the DEV environment on AWS account 987654321012
        id: deploy_cdk_to_the_dev_environment_on_aws_account_987654321012
        run: uv run projen dev:deploy
